<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VetVida — Painel</title>
<style>
:root{--red:#CC0000;--red-dk:#8f0000;--red-soft:#fdeeee;--bg:#eceef2;--border:#e6e8ec;--text:#161a22;--muted:#6b7280;--muted2:#a0a7b4;--sh:0 1px 2px rgba(16,24,40,.04),0 10px 34px rgba(16,24,40,.07);}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased;}
.card{background:#fff;border-radius:26px;padding:34px 30px 26px;width:100%;max-width:400px;box-shadow:var(--sh);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.logo-wrap{text-align:center;margin-bottom:26px;}
.logo-wrap img{height:112px;width:auto;display:block;margin:0 auto;}
.logo-wrap h1{font-size:18px;font-weight:700;letter-spacing:-.2px;margin-top:14px;}
.logo-wrap p{font-size:13px;color:var(--muted);margin-top:4px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:10.5px;font-weight:700;color:var(--muted2);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
.form-group input[type=text],.form-group input[type=password]{width:100%;border:1px solid var(--border);border-radius:14px;padding:13px 14px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;color:var(--text);background:#f7f8fa;font-family:inherit;}
.form-group input:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 4px var(--red-soft);}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:44px!important;}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted2);padding:8px;line-height:0;border-radius:10px;}
.pw-toggle:hover{color:var(--text);}
.lembrar{display:flex;align-items:center;gap:9px;margin:4px 0 16px;}
.lembrar input{width:17px;height:17px;cursor:pointer;accent-color:#CC0000;}
.lembrar label{font-size:13px;color:var(--muted);cursor:pointer;}
.btn-login{width:100%;background:var(--red);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;font-family:inherit;box-shadow:0 6px 16px rgba(204,0,0,.22);}
.btn-login:hover{background:#b30000;}
.btn-login:active{background:var(--red-dk);transform:scale(.985);}
.erro{color:var(--red);font-size:13px;text-align:center;margin-top:12px;display:none;background:var(--red-soft);border-radius:12px;padding:9px 12px;}
.rodape{text-align:center;font-size:11px;color:var(--muted2);margin-top:22px;}

/* SPLASH — a própria logo acende por partes */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;transition:opacity .25s;}
#splash.on{display:flex;opacity:1;}
#splash.out{opacity:0;}
.sp-logo{position:relative;width:min(170px,44vw);aspect-ratio:1000/716;}
.sp-logo img{position:absolute;inset:0;width:100%;height:100%;display:block;}
.sp-dim{filter:grayscale(1) brightness(1.7) contrast(.9);opacity:.22;}
.sp-lit{
  -webkit-mask-image:linear-gradient(100deg,transparent 0%,transparent 30%,#000 48%,#000 52%,transparent 70%,transparent 100%);
  mask-image:linear-gradient(100deg,transparent 0%,transparent 30%,#000 48%,#000 52%,transparent 70%,transparent 100%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:sp-sweep 1.1s cubic-bezier(.45,0,.35,1) infinite;
  filter:drop-shadow(0 0 10px rgba(204,0,0,.35));
}
@keyframes sp-sweep{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0% 0;mask-position:0% 0}}
.sp-txt{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);}
@media (prefers-reduced-motion:reduce){.sp-lit{animation:none;-webkit-mask-image:none;mask-image:none;opacity:.9}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-logo"><img class="sp-dim" src="logo-transparente.png" alt=""><img class="sp-lit" src="logo-transparente.png" alt=""></div>
  <div class="sp-txt">Carregando</div>
</div>
<div class="card" id="card">
  <div class="logo-wrap">
    <img src="logo-transparente.png" alt="Vet Vida">
    <h1>Vet Hub</h1>
    <p>Entre com seu usuário e senha</p>
  </div>

  <div class="form-group">
    <label>Usuário</label>
    <input type="text" id="login-user" placeholder="ex: paula" autocomplete="username"
      onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
  </div>

  <div class="form-group">
    <label>Senha</label>
    <div class="pw-wrap">
      <input type="password" id="login-pass" placeholder="••••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')fazerLogin()">
      <button class="pw-toggle" onclick="toggleSenha()" tabindex="-1" type="button" aria-label="Mostrar senha">
        <svg id="eye-i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="lembrar">
    <input type="checkbox" id="lembrar">
    <label for="lembrar">Lembrar meu acesso</label>
  </div>
  <button class="btn-login" onclick="fazerLogin()">Entrar</button>
  <div class="erro" id="erro">Usuário ou senha incorretos.</div>

  <div class="rodape">VetVida &copy; 2026</div>
</div>

<script>
// ── CREDENCIAIS CENTRALIZADAS ──────────────────────────────
const USUARIOS = {
  // Gestor
  'felipe':   { senha: 'gestorvv2026',   perfil: 'gestor'  },

  // Promotora
  'nicolle':  { senha: 'nicollevv2026',  perfil: 'nicolle' },

  // Representantes
  'paula':    { senha: 'vvpaula2026',    perfil: 'rep', rep: 'PAULA'   },
  'mauro':    { senha: 'vvmauro2026',    perfil: 'rep', rep: 'MAURO'   },
  'suane':    { senha: 'vvsuane2026',    perfil: 'rep', rep: 'SUANE'   },
  'vanessa':  { senha: 'vvvanessa2026',  perfil: 'rep', rep: 'VANESSA' },
  'nayara':   { senha: 'vvnayara2026',   perfil: 'rep', rep: 'NAYARA'  },
  'diego':    { senha: 'vvdiego2026',    perfil: 'rep', rep: 'DIEGO'   },

  // Motoristas (app de entregas)
  'alexandre': { senha: 'vvalexandre2026', perfil: 'motorista' },
  'sergio':    { senha: 'vvsergio2026',    perfil: 'motorista' },
};

// URLs dos sistemas (trocar para domínios próprios após configurar DNS)
const URLS = {
  gestor:  '/gestor-dashboard.html',
  nicolle: '/promotora',
  rep:     '/rep/rep.html',
  motorista: '/entregas/',
};
// promotora.vetvidasp.com/'
// rep:     'https://rep.vetvidasp.com/'

function irPara(destino, rapido) {
  // O gestor já mostra a animação enquanto carrega os dados; evita duplicar a espera.
  if (destino === URLS.gestor) { window.location.href = destino; return; }
  document.getElementById('card').style.display = 'none';
  document.getElementById('splash').classList.add('on');
  setTimeout(function(){ window.location.href = destino; }, rapido ? 200 : 350);
}

function fazerLogin() {
  const user = (document.getElementById('login-user').value || '').toLowerCase().trim();
  const pass = document.getElementById('login-pass').value;
  const erro = document.getElementById('erro');

  const match = USUARIOS[user];
  if (!match || match.senha !== pass) {
    erro.style.display = 'block';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
    return;
  }

  erro.style.display = 'none';

  const perfil = match.perfil === 'rep' ? match.rep : match.perfil;
  const lembrar = document.getElementById('lembrar').checked;

  // Sempre salvar em sessionStorage (sessão atual)
  sessionStorage.setItem('vv_auth', 'ok');
  sessionStorage.setItem('vv_perfil', perfil);
  sessionStorage.setItem('vv_user', user);

  // Se marcou "lembrar", salvar também em localStorage (persiste entre sessões)
  if (lembrar) {
    localStorage.setItem('vv_auth', 'ok');
    localStorage.setItem('vv_perfil', perfil);
    localStorage.setItem('vv_user', user);
    localStorage.setItem('vv_lembrar', '1');
  } else {
    localStorage.removeItem('vv_auth');
    localStorage.removeItem('vv_perfil');
    localStorage.removeItem('vv_user');
    localStorage.removeItem('vv_lembrar');
  }

  irPara(URLS[match.perfil] || URLS.rep, false);
}

function toggleSenha() {
  const input = document.getElementById('login-pass');
  const icon  = document.getElementById('eye-i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

window.addEventListener('load', function() {
  // Se veio de logout, limpar tudo e mostrar login
  var params = new URLSearchParams(window.location.search);
  if (params.get('logout') === '1') {
    sessionStorage.clear();
    localStorage.removeItem('vv_auth');
    localStorage.removeItem('vv_perfil');
    localStorage.removeItem('vv_user');
    localStorage.removeItem('vv_lembrar');
    window.history.replaceState({}, '', '/');
    document.getElementById('login-user').focus();
    return;
  }

  // Verificar se há sessão salva no localStorage
  var lsAuth   = localStorage.getItem('vv_auth');
  var lsPerfil = localStorage.getItem('vv_perfil');
  var lsUser   = localStorage.getItem('vv_user');
  var lsLembrar = localStorage.getItem('vv_lembrar');

  if (lsAuth === 'ok' && lsPerfil) {
    // Restaurar sessão e redirecionar direto
    sessionStorage.setItem('vv_auth', lsAuth);
    sessionStorage.setItem('vv_perfil', lsPerfil);
    sessionStorage.setItem('vv_user', lsUser || '');
    const perfMatch = Object.entries(USUARIOS).find(function(e){
      return (e[1].perfil === 'rep' || e[1].perfil === 'motorista') ? e[0] === lsUser : e[1].perfil === lsPerfil;
    });
    if (perfMatch) {
      irPara(URLS[perfMatch[1].perfil] || URLS.rep, true);
      return;
    }
  }

  // Preencher usuário se lembrado mas sem auto-login
  if (lsUser && lsLembrar) {
    document.getElementById('login-user').value = lsUser;
    document.getElementById('lembrar').checked = true;
    document.getElementById('login-pass').focus();
  } else {
    document.getElementById('login-user').focus();
  }
});
</script>
</body>
</html>
