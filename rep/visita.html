// ───────────────────────── UTIL ─────────────────────────
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();}
function brl(v){return 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function brl0(v){return 'R$ '+Math.round(Number(v)||0).toLocaleString('pt-BR');}
function toast(m){var t=$('tst');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function labKey(lab){var n=norm(lab);for(var i=0;i<LABS_EX.length;i++){if(n.indexOf(LABS_EX[i])===0)return LABS_EX[i];}return null;}
function pData(s){var p=String(s||'').split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):null;}
function diasEntre(a,b){return Math.round((b-a)/86400000);}

// ───────────────────────── INIT ─────────────────────────
function init(){
  var pf=sessionStorage.getItem('vv_perfil'), au=sessionStorage.getItem('vv_auth');
  if(au!=='ok'||!pf||pf==='gestor'||typeof TODOS_DADOS==='undefined'||!TODOS_DADOS[pf]){window.location.href='/';return;}
  REP=pf; DRAFT_KEY='vv_visita_draft_'+REP;
  AREA=(typeof AREAS_LABEL_DATA!=='undefined'&&AREAS_LABEL_DATA[REP])||'';
  CL=TODOS_DADOS[REP];
  if(typeof BASE_CLIENTES!=='undefined'){BASE_CLIENTES.forEach(function(b){BASEMAP[b.cod]=b;});}
  if(typeof PRODUTOS_VV!=='undefined'){PRODUTOS_VV.forEach(function(p){NOME2CAT[p.nome]=String(p.categoria||'').toUpperCase();});}

  s.onload=function(){HIST=(typeof HIST_REP!=='undefined'&&HIST_REP)||{};depoisDoHist();};
  s.onerror=function(){HIST={};depoisDoHist();};
  document.head.appendChild(s);
}
function depoisDoHist(){
  var cod=sessionStorage.getItem('visita_cod');
  var draft=lerDraft();
  if(cod){sessionStorage.removeItem('visita_cod');abrirCliente(cod);return;}
  if(draft&&draft.cod){telaRetomar(draft);return;}

}
function voltar(){
  if(CLI&&ETAPA>1){irEtapa(ETAPA-1);return;}
  if(CLI&&V&&!confirm('Sair da visita? O rascunho fica salvo neste aparelho.'))return;

}

// ───────────────────────── ESCOLHER CLIENTE ─────────────────────────
function telaEscolher(){
  CLI=null;V=null;pararTimer();$('timer').style.display='none';$('bar').style.display='none';
  $('h-titulo').textContent='Iniciar visita';
  var h='<input type="text" id="busca" placeholder="Buscar cliente (nome ou código)" oninput="filtrarClientes()">';
  h+='<div id="roteiro-hoje"></div><div id="lista"></div>';
  $('app').innerHTML=h;
  carregarRoteiroHoje();
}
function filtrarClientes(){
  var q=norm($('busca').value);
  var box=$('lista');
  if(q.length<2){box.innerHTML='';return;}
  var res=CL.filter(function(c){return norm(c.nome).indexOf(q)>=0||String(c.cod)===q||norm((BASEMAP[c.cod]||{}).razao_social).indexOf(q)>=0;}).slice(0,25);
  box.innerHTML=res.length?res.map(cliCard).join(''):'<p class="muted" style="margin-top:12px">Nenhum cliente encontrado.</p>';
}
function cliCard(c,extra){
  return '<div class="cli'+(extra&&extra.visitou?' visited':'')+'" onclick="abrirCliente('+c.cod+')"><b>'+esc(c.nome)+'</b><span>'+esc(c.municipio||'')+' · '+esc((BASEMAP[c.cod]||{}).segmento||c.segmento||'')+(extra&&extra.visitou?' · ✓ visitado nesta semana':'')+'</span></div>';
}
function carregarRoteiroHoje(){
  var dias=['','segunda','terca','quarta','quinta','sexta','sabado'];
  var dia=dias[new Date().getDay()];
  if(!dia||dia==='sabado'){return;}
  var sem=semanaAtual();
  Promise.all([
    sbGet('roteiros?rep=eq.'+encodeURIComponent(REP)+'&select=cod_cli,nome_cli,dia_semana,semanas_mes'),
    sbGet('visitas_realizadas?rep=eq.'+encodeURIComponent(REP)+'&semanas_mes=eq.'+sem+'&realizada=eq.true&select=cod_cli')
  ]).then(function(rs){
    var feitas={};rs[1].forEach(function(v){feitas[String(v.cod_cli)]=1;});
    var lista=rs[0].filter(function(r){
      var s=Array.isArray(r.semanas_mes)?r.semanas_mes:(r.semanas_mes?JSON.parse(r.semanas_mes):[1]);
      return r.dia_semana===dia&&s.indexOf(sem)>=0;
    });
    if(!lista.length||!$('roteiro-hoje'))return;
    var h='<h3 style="font-size:12px;color:var(--muted);text-transform:uppercase;margin:14px 0 8px">Roteiro de hoje ('+lista.length+')</h3>';
    lista.forEach(function(r){
      var c=CL.find(function(x){return x.cod===r.cod_cli;})||{cod:r.cod_cli,nome:r.nome_cli,municipio:''};
      h+=cliCard(c,{visitou:!!feitas[String(r.cod_cli)]});
    });
    $('roteiro-hoje').innerHTML=h;
  }).catch(function(){});
}
function telaRetomar(d){
  $('app').innerHTML='<div class="card"><h3>Visita em andamento</h3><p style="font-size:14px;margin-bottom:12px"><b>'+esc(d.nome_cli||d.cod)+'</b><br><span class="muted">Iniciada às '+esc(new Date(d.inicio).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))+'</span></p>'
   +'<div class="row"><button class="btn" onclick="abrirCliente('+JSON.stringify(String(d.cod))+',true)">Retomar</button><button class="btn sec" onclick="descartarDraft()">Descartar</button></div></div>';
}
function descartarDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}telaEscolher();}

// ───────────────────────── DRAFT ─────────────────────────
function lerDraft(){try{var s=localStorage.getItem(DRAFT_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function salvarDraft(){if(!V)return;try{localStorage.setItem(DRAFT_KEY,JSON.stringify(V));}catch(e){}}

// ───────────────────────── ABRIR CLIENTE ─────────────────────────
function abrirCliente(cod,retomar){
  cod=String(cod);
  CLI=CL.find(function(c){return String(c.cod)===cod;});
  if(!CLI){var b=BASEMAP[+cod]||{};CLI={cod:+cod,nome:b.nome||('Cliente '+cod),municipio:b.municipio||''};}
  var d=lerDraft();
  if(retomar&&d&&String(d.cod)===cod){V=d;}
  else{
    V={cod:cod,nome_cli:CLI.nome,rep:REP,area:AREA,inicio:new Date().toISOString(),checklist:{},ofertas:{},resultado:'',valor_pedido:'',objecoes:[],proximo_passo:'',proxima_visita:'',obs:''};

  }
  ETAPA=1;
  CTX=calcularContexto(CLI);
  $('timer').style.display='';iniciarTimer();
  render();
  carregarSupabaseCliente();

// ───────────────────────── CÁLCULOS (somente labs exclusivos) ─────────────────────────
function pedidosEx(cod){
  var h=HIST[cod]||HIST[String(cod)]; if(!h||!h.pedidos)return [];
  var out=[];
  h.pedidos.forEach(function(p){
    var d=pData(p.data); if(!d)return;
    var it=(p.itens||[]).filter(function(i){return labKey(i.lab);});
    if(!it.length)return;
    var tot=0;it.forEach(function(i){tot+=Number(i.val)||0;});
    out.push({d:d,itens:it,total:tot});
  });
  out.sort(function(a,b){return a.d-b.d;});
  return out;
}
function boughtSet(peds,meses){
  var lim=new Date();lim.setMonth(lim.getMonth()-meses);
  var s={};peds.forEach(function(p){if(p.d>=lim)p.itens.forEach(function(i){s[i.prod]=(s[i.prod]||0)+(Number(i.qtde)||0);});});
  return s;
}
function resumoCliente(peds){
  var hoje=new Date(),r={n12:0,ticket:0,ult:null,dias:null,ciclo:null,fatMes:0,fatMesAnt:0};
  if(!peds.length)return r;
  var lim=new Date();lim.setMonth(lim.getMonth()-12);
  var p12=peds.filter(function(p){return p.d>=lim;});
  r.n12=p12.length;
  if(p12.length){var t=0;p12.forEach(function(p){t+=p.total;});r.ticket=t/p12.length;}
  r.ult=peds[peds.length-1];r.dias=diasEntre(r.ult.d,hoje);
  if(p12.length>=3){var gaps=[];for(var i=1;i<p12.length;i++){gaps.push(diasEntre(p12[i-1].d,p12[i].d));}
    gaps.sort(function(a,b){return a-b;});r.ciclo=gaps[Math.floor(gaps.length/2)];}
  var m=hoje.getMonth(),y=hoje.getFullYear();
  peds.forEach(function(p){
    if(p.d.getMonth()===m&&p.d.getFullYear()===y)r.fatMes+=p.total;
    var pm=m===0?11:m-1,py=m===0?y-1:y;
    if(p.d.getMonth()===pm&&p.d.getFullYear()===py)r.fatMesAnt+=p.total;
  });
  return r;
}
// Campanha: média por PEDIDO do cliente em cada regra, faixa atual e próxima
function planoCampanha(peds){
  var plano={ativas:[],semCompra:[]};
  if(typeof CAMPANHA==='undefined'||!CAMPANHA.regras)return plano;
  var lim=new Date();lim.setMonth(lim.getMonth()-12);
  var p12=peds.filter(function(p){return p.d>=lim;});
  CAMPANHA.regras.forEach(function(r){
    var set={};r.produtos.forEach(function(n){set[n]=1;});
    var qtds=[],ultVal=0,ultQ=0;
    p12.forEach(function(p){
      var porProd={},tot=0,val=0;
      p.itens.forEach(function(i){if(set[i.prod]){var q=Number(i.qtde)||0;porProd[i.prod]=(porProd[i.prod]||0)+q;tot+=q;val+=Number(i.val)||0;}});
      if(!tot)return;
      var q=r.mix?tot:Math.max.apply(null,Object.keys(porProd).map(function(k){return porProd[k];}));
      qtds.push(q);ultVal=val;ultQ=tot;
    });
    var faixas=(r.faixas||[]).slice().sort(function(a,b){return a.min-b.min;});
    if(!qtds.length){plano.semCompra.push({regra:r,faixas:faixas});return;}
    var soma=0;qtds.forEach(function(q){soma+=q;});
    var media=soma/qtds.length,a=Math.floor(media+1e-9);
    var atual=null,prox=null;
    faixas.forEach(function(f){if(f.min<=a)atual=f;});
    for(var i=0;i<faixas.length;i++){if(faixas[i].min>a){prox=faixas[i];break;}}
    var sug=null;
    if(prox&&a>=1&&prox.min<=a*2)sug={qtd:prox.min,mais:prox.min-a,pct:prox.pct};
    var preco=ultQ?ultVal/ultQ:0;
    plano.ativas.push({regra:r,faixas:faixas,pedidos:qtds.length,media:media,a:a,atual:atual,prox:prox,sug:sug,preco:preco,distante:!!(prox&&!sug)});
  });
  plano.ativas.sort(function(x,y){return (y.sug?1:0)-(x.sug?1:0)||y.media-x.media;});
  return plano;
}
// Meta × ritmo do rep (labs exclusivos), a partir do histórico da carteira
function ritmoMeta(){
  var out=[],hoje=new Date(),m=hoje.getMonth(),y=hoje.getFullYear();
  var metas=(typeof METAS_POR_MES!=='undefined'&&METAS_POR_MES[m+1]&&METAS_POR_MES[m+1][REP])||null;
  if(!metas)return out;
  var fat={};
  Object.keys(HIST).forEach(function(cod){
    var h=HIST[cod];if(!h||!h.pedidos)return;
    h.pedidos.forEach(function(p){var d=pData(p.data);if(!d||d.getMonth()!==m||d.getFullYear()!==y)return;
      (p.itens||[]).forEach(function(i){var k=labKey(i.lab);if(k)fat[k]=(fat[k]||0)+(Number(i.val)||0);});});
  });
  var du=0,dt=0;for(var d=1;d<=new Date(y,m+1,0).getDate();d++){var w=new Date(y,m,d).getDay();if(w>0&&w<6){dt++;if(d<=hoje.getDate())du++;}}
  var ritmo=dt?du/dt:0;
  LABS_EX.forEach(function(k){
    var meta=metas[LAB_ROTULO[k]];if(!meta)return;
    out.push({lab:k,rotulo:LAB_ROTULO[k],fat:fat[k]||0,meta:meta,pct:(fat[k]||0)/meta,ritmo:ritmo,atras:((fat[k]||0)/meta)<ritmo-0.05});
  });
  return out;
}
// Cross-sell (Radar): gatilho = categoria que o cliente já compra
var GATILHOS=[
  {re:/ANTIBIOTIC|ANTIMICROB/,cats:['ANTIBIOTICOS','ANTIMICROBIANOS']},
  {re:/ANTI INFLAMAT|OSTEOARTIC/,cats:['ANTIINFLAMATORIO','ANALGESICOS']},
  {re:/^DERMATOLOG/,cats:['DERMATOLOGICOS','DERMOCOSMETICOS']},
  {re:/OTOLOG/,cats:['OTOLOGICOS']},
  {re:/OFTALMOLOG/,cats:['OFTALMOLOGICOS']},
  {re:/ANTIPULGAS|ECTOPARAS/,cats:['ANTIPULGAS','ANTIPARASITARIOS']},
  {re:/^VERMIFUGO/,cats:['VERMIFUGO','VERMIFUGOS']},
  {re:/HEPATIC/,nome:/HEP/},
  {re:/RENAL|URINARIO/,nome:/CISPET|RENNAPRO|CYST/},
  {re:/SENIOR/,nome:/GERIOOX|SENIOR|GERIATRIC/},
  {re:/COMPORTAMENTO/,nome:/ANIZEN|CALMYN|AKALME/},
  {re:/HIGIENE ORAL/,cats:['CREME DENTAL','BUCAL'],nome:/VETRADENT|HALITO/},
  {re:/BOLAS DE PELO/,nome:/MALT/},
  {re:/RECUPERACAO/,nome:/ENERGY|GLICOL|NUTRICUPER|NUTRIFULL/},
  {re:/IMUNOLOG/,nome:/IMMUNITY|MUNNOMAX|PROMUN/},
  {re:/CICATRIZ/,cats:['CICATRIZANTE','CICATRIZANTES']},
  {re:/COSMETICOS SHAMPOO/,cats:['COSMETICOS'],nome:/SHAMPOO/},
  {re:/DERMOCOSMETICOS/,cats:['DERMOCOSMETICOS']}
];
function gatilhoDe(texto){var n=norm(texto);for(var i=0;i<GATILHOS.length;i++){if(GATILHOS[i].re.test(n))return GATILHOS[i];}return null;}
function itemCumpre(g,prod){
  var cat=NOME2CAT[prod]||'';
  if(g.cats&&g.cats.indexOf(cat)>=0)return true;
  if(g.nome&&g.nome.test(norm(prod)))return true;
  return false;
}
var CATALOGO_EX=null;
function catalogoEx(){
  if(CATALOGO_EX)return CATALOGO_EX;
  CATALOGO_EX=[];
  if(typeof PRODUTOS_VV!=='undefined')PRODUTOS_VV.forEach(function(p){if(labKey(p.lab))CATALOGO_EX.push({nome:p.nome,n:norm(p.nome),lab:labKey(p.lab)});});
  return CATALOGO_EX;
}
function resolverFrase(frase){
  var f=norm(frase);if(f.length<4)return [];
  return catalogoEx().filter(function(p){return p.n===f||p.n.indexOf(f+' ')===0;});
}
function compradoFrase(set,frase){var f=norm(frase);return Object.keys(set).some(function(n){var x=norm(n);return x===f||x.indexOf(f+' ')===0;});}
var SETS_CARTEIRA=null;
function setsCarteira(){
  if(SETS_CARTEIRA)return SETS_CARTEIRA;
  SETS_CARTEIRA=[];
  CL.forEach(function(c){var s=boughtSet(pedidosEx(c.cod),12);if(Object.keys(s).length)SETS_CARTEIRA.push({cod:c.cod,seg:norm((BASEMAP[c.cod]||{}).segmento),s:s});});
  return SETS_CARTEIRA;
}
function parcela(frase,seg){
  var todos=setsCarteira(),grupo=todos.filter(function(x){return x.seg===seg;});
  var base=grupo.length>=8?grupo:todos;
  if(!base.length)return {p:0,n:0,total:0,seg:grupo.length>=8?seg:''};
  var q=base.filter(function(x){return compradoFrase(x.s,frase);}).length;
  return {p:q/base.length,n:q,total:base.length,seg:grupo.length>=8?seg:''};
}
function crossSell(peds,plano,ritmo){
  var set12=boughtSet(peds,12),comprados=Object.keys(set12);
  var seg=norm((BASEMAP[CLI.cod]||{}).segmento);
  var atras={};ritmo.forEach(function(r){if(r.atras)atras[r.lab]=1;});
  var emCamp={};if(typeof CAMPANHA!=='undefined')CAMPANHA.regras.forEach(function(r){r.produtos.forEach(function(n){emCamp[n]=r.nome;});});
  var vistos={},out=[];
  (typeof CROSS_DB!=='undefined'?CROSS_DB:[]).forEach(function(rule){
    var g=gatilhoDe(rule.gatilho);if(!g)return;
    var gatilhoItens=comprados.filter(function(p){return itemCumpre(g,p);});
    if(!gatilhoItens.length)return;
    rule.produtos.forEach(function(fr){
      if(vistos[norm(fr)])return;
      var res=resolverFrase(fr);if(!res.length)return;           // fora dos 5 labs exclusivos → não sugere
      if(compradoFrase(set12,fr))return;                          // já compra
      vistos[norm(fr)]=1;
      var pc=parcela(fr,seg),camp=null;
      res.forEach(function(r){if(emCamp[r.nome])camp=emCamp[r.nome];});
      var lab=res[0].lab,score=(rule.prio==='Alta'?1:.5)+pc.p*2+(camp?.5:0)+(atras[lab]?.3:0);
      out.push({frase:fr,lab:lab,gatilho:rule.gatilho,compra:gatilhoItens[0],just:rule.just,prio:rule.prio,pc:pc,camp:camp,score:score,res:res.slice(0,3).map(function(r){return r.nome;})});
    });
  });
  out.sort(function(a,b){return b.score-a.score;});
  return out.slice(0,8);
}
function calcularContexto(c){
  var peds=pedidosEx(c.cod),resumo=resumoCliente(peds),plano=planoCampanha(peds),ritmo=ritmoMeta();
  var h=HIST[c.cod]||HIST[String(c.cod)]||{};
  var parados=(h.parados||[]).filter(function(p){return labKey(p.lab);}).slice(0,8);
  return {peds:peds,resumo:resumo,plano:plano,ritmo:ritmo,cross:crossSell(peds,plano,ritmo),parados:parados,sb:{estoque:null,acoes:null,contatos:null,visitas:null,erro:false}};
}

function carregarSupabaseCliente(){
  var cod=encodeURIComponent(CLI.cod),alvo=CLI.cod;
  function ok(k,fn){return function(v){if(!CLI||CLI.cod!==alvo)return;CTX.sb[k]=fn?fn(v):v;if(ETAPA===1)renderConteudo();};}
  function falha(){if(!CLI||CLI.cod!==alvo)return;CTX.sb.erro=true;if(ETAPA===1)renderConteudo();}
  sbGet('contagens_estoque?cod_cli=eq.'+cod+'&select=produto,qtde_estoque,created_at&order=created_at.desc&limit=200').then(ok('estoque',function(rows){
    var ult={};rows.forEach(function(r){if(!ult[r.produto])ult[r.produto]=r;});

    return {quando:rows.length?new Date(rows[0].created_at):null,itens:arr};
  })).catch(falha);
  sbGet('acoes_comerciais?cliente_cod=eq.'+cod+'&status=eq.ativa&select=titulo,tipo,meta_tipo,meta_valor,data_fim,produto_alvo').then(ok('acoes')).catch(falha);
  sbGet('contatos?cod_cliente=eq.'+cod+'&select=status,obs,data_hora&order=data_hora.desc&limit=3').then(ok('contatos')).catch(falha);
  sbGet('visitas_rep?cod_cli=eq.'+cod+'&select=inicio,resultado,proximo_passo,proxima_visita,objecao,obs,rep&order=inicio.desc&limit=3').then(ok('visitas')).catch(function(){if(CLI&&CLI.cod===alvo){CTX.sb.visitas=[];if(ETAPA===1)renderConteudo();}});
}

    h+='<div class="item"><div class="t">'+esc(c.frase)+' <span class="pill b">'+esc(c.lab.replace('BIOGENESIS','BIOGÊNESIS'))+'</span>'+(c.prio==='Alta'?' <span class="pill g">alta prioridade</span>':'')+(c.camp?' <span class="pill y">na campanha</span>':'')+'</div><div class="s">'+porque+'</div>'+(pot?'<div class="s">'+pot+'</div>':'')+opcoesOferta(chave)+'</div>';
  });
  h+='<p class="muted" style="margin-top:6px">Sugestões de categoria: o protocolo é definido pelo veterinário.</p></div>';
  return h;
}

function htmlEtapa3(){
  var h='<div class="card"><h3>Resultado</h3><div class="chips">';
  RESULTADOS.forEach(function(r){h+='<button class="chip'+(V.resultado===r[0]?' on':'')+'" onclick="setRes(\''+r[0]+'\')">'+r[1]+'</button>';});
  h+='</div>';
  if(V.resultado==='pedido_fechado')h+='<label class="l">Valor do pedido (R$)</label><input type="number" inputmode="decimal" step="0.01" id="f-valor" value="'+esc(V.valor_pedido)+'" oninput="V.valor_pedido=this.value;salvarDraft()">';
  h+='</div>';
  var ofs=Object.keys(V.ofertas).map(function(k){return V.ofertas[k];});
  h+='<div class="card"><h3>Ofertas apresentadas</h3>';
  if(!ofs.length)h+='<p class="muted">Nada marcado na abordagem. Volte à etapa ② para marcar o que foi oferecido e a resposta do cliente.</p>';
  else{var rot={aceitou:'✔ aceitou',pensar:'vai pensar',recusou:'recusou'};ofs.forEach(function(o){h+='<div class="kv"><span>'+esc(o.nome)+'</span><b>'+rot[o.resposta]+(o.qtd_sugerida?' · '+o.qtd_sugerida+' un':'')+'</b></div>';});}
  h+='</div>';
  h+='<div class="card"><h3>Objeção do cliente</h3><div class="chips">';
  OBJECOES.forEach(function(o){h+='<button class="chip'+(V.objecoes.indexOf(o)>=0?' on':'')+'" onclick="toggleObj(\''+o+'\')">'+o+'</button>';});
  h+='</div></div>';
  h+='<div class="card"><h3>Próximo passo</h3><label class="l" style="margin-top:0">O que ficou combinado</label><input type="text" id="f-passo" value="'+esc(V.proximo_passo)+'" placeholder="Ex.: enviar proposta de Cardisure, voltar com campanha" oninput="V.proximo_passo=this.value;salvarDraft()">';
  h+='<label class="l">Data da próxima visita / retorno</label><input type="date" id="f-prox" value="'+esc(V.proxima_visita)+'" onchange="V.proxima_visita=this.value;salvarDraft()">';
  h+='<label class="l">Observações</label><textarea id="f-obs" oninput="V.obs=this.value;salvarDraft()">'+esc(V.obs)+'</textarea></div>';
  return h;
}
function setRes(r){V.resultado=r;salvarDraft();renderConteudo();}
function toggleObj(o){var i=V.objecoes.indexOf(o);if(i>=0)V.objecoes.splice(i,1);else V.objecoes.push(o);salvarDraft();renderConteudo();}

// ───────────────────────── TIMER ─────────────────────────
function iniciarTimer(){pararTimer();function t(){if(!V)return;var s=Math.floor((Date.now()-new Date(V.inicio).getTime())/1000);if(s<0)s=0;var m=Math.floor(s/60);$('timer').textContent=('0'+m).slice(-2)+':'+('0'+(s%60)).slice(-2);}t();TIMER=setInterval(t,1000);}
function pararTimer(){if(TIMER){clearInterval(TIMER);TIMER=null;}}

// ───────────────────────── SALVAR ─────────────────────────
function montarPayload(){
  var fim=new Date(),ini=new Date(V.inicio);
  var ofs=Object.keys(V.ofertas).map(function(k){return V.ofertas[k];});
  var cp=CTX?CTX.plano.ativas.map(function(x){return {regra:x.regra.id,media:Math.round(x.media*10)/10,sugerido:x.sug?x.sug.qtd:null};}):[];
  var d=new Date();
  return {
    rep:REP,area:AREA||null,cod_cli:String(V.cod),nome_cli:V.nome_cli,
    inicio:ini.toISOString(),fim:fim.toISOString(),duracao_min:Math.max(1,Math.round((fim-ini)/60000)),
    resultado:V.resultado,houve_pedido:V.resultado==='pedido_fechado',
    valor_pedido:(V.resultado==='pedido_fechado'&&V.valor_pedido!=='')?Number(V.valor_pedido):null,
    campanha_mes:(typeof CAMPANHA!=='undefined')?CAMPANHA.mes:null,
    checklist:{conferidos:V.checklist,resumo:CTX?{dias_ult_compra:CTX.resumo.dias,ticket_medio:Math.round(CTX.resumo.ticket)}:null},
    ofertas:ofs.filter(function(o){return o.tipo!=='cross';}),
    cross_sell:ofs.filter(function(o){return o.tipo==='cross';}),
    objecao:V.objecoes.length?V.objecoes.join(', '):null,
    proximo_passo:V.proximo_passo||null,
    proxima_visita:V.proxima_visita||null,
    obs:V.obs||null,
    roteiro_semana:semanaAtual()
  };
}
function salvarVisita(){
  if(SALVANDO)return;
  if(!V.resultado){toast('Escolha o resultado da visita.');irEtapa(3);return;}
  if(V.resultado==='pedido_fechado'&&(V.valor_pedido===''||Number(V.valor_pedido)<=0)&&!confirm('Pedido fechado sem valor informado. Salvar assim mesmo?'))return;
  SALVANDO=true;var b=$('b-salvar');if(b){b.disabled=true;b.textContent='Salvando…';}
  var payload=montarPayload(),cod=V.cod,nome=V.nome_cli;
  fetch(SB_URL+'/rest/v1/visitas_rep',{method:'POST',headers:sbH('return=minimal'),body:JSON.stringify(payload)})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return marcarRoteiro(cod,nome);})
  .then(function(){concluir(true);})
  .catch(function(){enfileirar(payload);concluir(false);});
}
function marcarRoteiro(cod,nome){
  var sem=semanaAtual(),d=new Date(),ini=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-01';
  return sbGet('visitas_realizadas?rep=eq.'+encodeURIComponent(REP)+'&cod_cli=eq.'+encodeURIComponent(cod)+'&semanas_mes=eq.'+sem+'&data_visita=gte.'+ini+'&select=id,realizada&limit=1')
  .then(function(rows){
    if(rows.length){if(rows[0].realizada)return;return fetch(SB_URL+'/rest/v1/visitas_realizadas?id=eq.'+rows[0].id,{method:'PATCH',headers:sbH('return=minimal'),body:JSON.stringify({realizada:true})});}
    var iso=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    return fetch(SB_URL+'/rest/v1/visitas_realizadas',{method:'POST',headers:sbH('return=minimal'),body:JSON.stringify([{rep:REP,cod_cli:isNaN(+cod)?cod:+cod,nome_cli:nome,data_visita:iso,semanas_mes:sem,realizada:true,obs:''}])});
  }).catch(function(){/* o registro principal já foi gravado; roteiro é secundário */});
}
function concluir(online){
  SALVANDO=false;pararTimer();
  try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
  var nome=V.nome_cli,res=(RESULTADOS.filter(function(x){return x[0]===V.resultado;})[0]||['',''])[1];
  V=null;CLI=null;$('timer').style.display='none';$('bar').style.display='none';
  $('h-titulo').textContent='Visita registrada';
  $('app').innerHTML='<div class="card" style="text-align:center;padding:26px 16px"><div style="font-size:40px">'+(online?'✅':'📲')+'</div><p style="font-size:16px;font-weight:800;margin:8px 0 4px">'+esc(nome)+'</p><p class="muted">'+esc(res)+'</p><p style="font-size:13px;margin-top:10px">'+(online?'Visita gravada com sucesso.':'Sem conexão: a visita ficou salva neste aparelho e será enviada sozinha quando a internet voltar.')+'</p></div><div class="row" style="margin-top:12px"><button class="btn" onclick="telaEscolher()">Nova visita</button><button class="btn sec" onclick="window.location.href=\'rep.html\'">Painel</button></div>';
}

// ───────────────────────── FILA OFFLINE ─────────────────────────
function enfileirar(p){try{var f=JSON.parse(localStorage.getItem(FILA_KEY)||'[]');f.push(p);localStorage.setItem(FILA_KEY,JSON.stringify(f));}catch(e){}}
function flushFila(){
  var f;try{f=JSON.parse(localStorage.getItem(FILA_KEY)||'[]');}catch(e){return;}
  if(!f.length||!navigator.onLine)return;
  var restantes=[],seq=Promise.resolve();
  f.forEach(function(p){seq=seq.then(function(){return fetch(SB_URL+'/rest/v1/visitas_rep',{method:'POST',headers:sbH('return=minimal'),body:JSON.stringify(p)}).then(function(r){if(!r.ok)restantes.push(p);}).catch(function(){restantes.push(p);});});});
  seq.then(function(){try{localStorage.setItem(FILA_KEY,JSON.stringify(restantes));}catch(e){}if(restantes.length<f.length)toast((f.length-restantes.length)+' visita(s) pendente(s) enviada(s).');});
}

init();
</script>
</body></html>
