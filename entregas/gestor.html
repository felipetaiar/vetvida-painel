<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vet Vida — Entregas (Gestor)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--red:#CC0000;--red-s:rgba(204,0,0,.08);--bg:#f5f6f8;--sf:#fff;--bd:#e5e7eb;--tx:#1f2937;--tx2:#6b7280;--tx3:#9ca3af;--grn:#16a34a;--grn-s:rgba(22,163,74,.1);--amb:#d97706;--amb-s:rgba(217,119,6,.1);--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.hdr{background:var(--sf);border-bottom:3px solid var(--red);padding:10px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:600;flex-wrap:wrap}
.hdr img{height:36px}.hdr h1{font-size:16px;font-weight:800}.hdr p{font-size:11px;color:var(--tx2)}
.hdr .dir{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr input,.hdr a,.hdr button{font-family:inherit;font-size:12px;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;background:var(--sf);color:var(--tx);text-decoration:none;cursor:pointer}
.cont{max-width:1300px;margin:0 auto;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sf);border-radius:var(--r);padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kpi .v{font-size:24px;font-weight:800}.kpi .l{font-size:11px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.lay{display:grid;grid-template-columns:380px 1fr;gap:14px}
@media(max-width:900px){.lay{grid-template-columns:1fr}}
.card{background:var(--sf);border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:14px}
.card h2{font-size:13px;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
#mapa{height:520px;border-radius:10px}
.mot{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.mot .top{display:flex;justify-content:space-between;align-items:baseline}.mot b{font-size:15px}
.mot .s{font-size:12px;color:var(--tx2)}
.prog{height:8px;background:#eef0f3;border-radius:6px;overflow:hidden;margin:6px 0;display:flex}.prog i{display:block;height:100%}
.rom{font-size:12px;color:var(--tx2);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;padding:8px 6px;border-bottom:2px solid var(--bd);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid #f1f3f6;vertical-align:top}
tr.oc td{background:#fffbeb}
.st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:12px;white-space:nowrap}
.st.pendente{background:#f1f3f6;color:var(--tx2)}.st.entregue{background:var(--grn-s);color:var(--grn)}.st.ocorrencia{background:var(--amb-s);color:var(--amb)}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--bd)}
.pin{color:#fff;border:2px solid #fff;border-radius:50%;width:24px!important;height:24px!important;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.vazio{padding:30px;text-align:center;color:var(--tx2)}
.filtros{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filtros button{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--bd);background:var(--sf);border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--tx2)}
.filtros button.on{background:var(--red);border-color:var(--red);color:#fff}
.foto-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:2100;cursor:zoom-out}
.foto-bg img{max-width:94vw;max-height:90vh;border-radius:8px}
</style>
</head>
<body>
<div class="hdr">
  <img src="/logo.jpg" alt="Vet Vida">
  <div><h1>Entregas</h1><p id="atualizado">Carregando…</p></div>
  <div class="dir">
    <form onsubmit="buscarNF();return false" style="display:flex;gap:4px"><input type="text" id="busca-nf" placeholder="Nº da NF" inputmode="numeric" style="width:110px"><button type="submit">🔎 Canhoto</button></form>
    <input type="date" id="dia" onchange="carregar()">
    <button onclick="carregar()">🔄 Atualizar</button>
    <a href="/entregas/">📱 Ver como motorista</a>
    <a href="/gestor-dashboard.html">← Painel</a>
  </div>
</div>

<div class="cont">
  <div class="kpis" id="kpis"></div>
  <div class="lay">
    <div>
      <div class="card"><h2>Motoristas</h2><div id="motoristas"></div></div>
      <div class="card"><h2>Ocorrências</h2><div id="ocorrencias"></div></div>
    </div>
    <div>
      <div class="card"><h2>Mapa</h2><div id="mapa"></div></div>
    </div>
  </div>
  <div class="card">
    <h2>Paradas</h2>
    <div class="filtros" id="filtros"></div>
    <div style="overflow-x:auto"><table><thead><tr>
      <th>#</th><th>Cliente</th><th>Bairro / cidade</th><th>Motorista</th><th>Rota</th><th>NF</th><th>Status</th><th>Hora</th><th>Recebedor / obs.</th><th>Foto</th><th>Mover para</th>
    </tr></thead><tbody id="tbody"></tbody></table></div>
  </div>
</div>
<div class="foto-bg" id="foto-bg" onclick="this.style.display='none'"><img id="foto-big" alt=""></div>
<div class="foto-bg" id="nf-bg" style="cursor:default;z-index:2000" onclick="if(event.target===this)this.style.display='none'">
  <div style="background:#fff;border-radius:14px;max-width:760px;width:94vw;max-height:90vh;overflow:auto;padding:18px" id="nf-corpo"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/entregas/comum.js"></script>
<script>
var SESS = entSessao();
var ROMS = [], PARADAS = [], FILTRO = 'todas', MAPA = null, CAMADA = null, PRIMEIRA = true;
var NOME_MOT = {};
Object.keys(ENT.MOTORISTAS).forEach(function (u) { NOME_MOT[ENT.MOTORISTAS[u].cd] = ENT.MOTORISTAS[u].nome; });
var CORES_MOT = ['#2563eb', '#7c3aed', '#0891b2', '#db2777'];

if (!SESS.ok || SESS.perfil !== 'gestor') { window.location.href = '/'; }

(function init() {
  var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
  document.getElementById('dia').value = d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  carregar();
  setInterval(carregar, 60000);
})();

function inicioDia() { var v = document.getElementById('dia').value.split('-'); return new Date(+v[0], +v[1] - 1, +v[2]); }
function mesmoDia(a, b) { a = new Date(a); return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

// Romaneios do dia escolhido: montados nele, finalizados nele, ou ainda abertos (se o dia for hoje)
function carregar() {
  var dia = inicioDia(), ini = new Date(dia); ini.setDate(ini.getDate() - 7);
  var fim = new Date(dia); fim.setDate(fim.getDate() + 1);
  var ehHoje = mesmoDia(new Date(), dia);
  sbGet('entregas_romaneios?dt_montagem=gte.' + encodeURIComponent(ini.toISOString()) +
        '&dt_montagem=lt.' + encodeURIComponent(fim.toISOString()) + '&order=dt_montagem.asc')
    .then(function (roms) {
      ROMS = roms.filter(function (r) {
        return mesmoDia(r.dt_montagem, dia) || (r.finalizado_em && mesmoDia(r.finalizado_em, dia)) ||
               (r.iniciado_em && mesmoDia(r.iniciado_em, dia)) || (ehHoje && r.status_app !== 'finalizado');
      });
      if (!ROMS.length) return [];
      var ids = ROMS.map(function (r) { return r.nu_rom; }).join(',');
      return sbGet('entregas_paradas?or=' + encodeURIComponent('(nu_rom.in.(' + ids + '),rom_app.in.(' + ids + '))') + '&status=neq.removida&order=ordem.asc.nullslast');
    })
    .then(function (ps) {
      var ok = {}; ROMS.forEach(function (r) { ok[r.nu_rom] = true; });
      PARADAS = ps.filter(function (p) { return ok[romDaParada(p)]; });
      document.getElementById('atualizado').textContent = 'Atualizado às ' + fmtHora(new Date()) + ' · atualiza a cada minuto';
      renderTudo();
    })
    .catch(function (e) {
      console.error(e);
      document.getElementById('atualizado').textContent = 'Erro ao carregar: ' + e.message;
    });
}

function romDe(p) { var n = romDaParada(p); return ROMS.find(function (r) { return r.nu_rom === n; }) || {}; }

function renderTudo() { renderKpis(); renderMotoristas(); renderOcorrencias(); renderTabela(); renderMapa(); }

function renderKpis() {
  var t = PARADAS.length;
  var e = PARADAS.filter(function (p) { return p.status === 'entregue'; }).length;
  var o = PARADAS.filter(function (p) { return p.status === 'ocorrencia'; }).length;
  var semFoto = PARADAS.filter(function (p) { return p.status === 'entregue' && !p.foto_url; }).length;
  var semCoord = PARADAS.filter(function (p) { return !temCoord(p); }).length;
  var k = [
    [ROMS.length, 'Romaneios'], [t, 'Paradas'], [e, 'Entregues'], [o, 'Ocorrências'],
    [t - e - o, 'Pendentes'], [PARADAS.filter(function (p) { return p.carregado || p.status !== 'pendente'; }).length + ' / ' + t, 'No carro / saíram'],
    [semFoto, 'Entregues sem foto'], [semCoord, 'Sem localização']
  ];
  document.getElementById('kpis').innerHTML = k.map(function (x) {
    return '<div class="kpi"><div class="v">' + x[0] + '</div><div class="l">' + x[1] + '</div></div>';
  }).join('');
}

function renderMotoristas() {
  var porMot = {};
  ROMS.forEach(function (r) { (porMot[r.cd_motor] = porMot[r.cd_motor] || []).push(r); });
  var cds = Object.keys(porMot);
  if (!cds.length) { document.getElementById('motoristas').innerHTML = '<div class="vazio">Nenhum romaneio neste dia.</div>'; return; }
  document.getElementById('motoristas').innerHTML = cds.map(function (cd) {
    var nus = porMot[cd].map(function (r) { return r.nu_rom; });
    var ps = PARADAS.filter(function (p) { return nus.indexOf(romDaParada(p)) >= 0; });
    var e = ps.filter(function (p) { return p.status === 'entregue'; }).length;
    var o = ps.filter(function (p) { return p.status === 'ocorrencia'; }).length;
    var ult = ps.map(function (p) { return p.baixa_em; }).filter(Boolean).sort().pop();
    var t = ps.length || 1;
    return '<div class="mot"><div class="top"><b>' + esc(NOME_MOT[cd] || cd) + '</b><span class="s">' + (e + o) + ' / ' + ps.length + '</span></div>' +
      '<div class="prog"><i style="width:' + (e / t * 100) + '%;background:var(--grn)"></i><i style="width:' + (o / t * 100) + '%;background:var(--amb)"></i></div>' +
      '<div class="s">' + e + ' entregue' + (e === 1 ? '' : 's') + (o ? ' · ' + o + ' ocorrência' + (o > 1 ? 's' : '') : '') +
      (ult ? ' · última baixa ' + fmtHora(ult) : ' · nenhuma baixa ainda') + '</div>' +
      porMot[cd].map(function (r) {
        var st = r.status_app === 'finalizado' ? '✅ finalizado ' + fmtHora(r.finalizado_em) : r.status_app === 'em_rota' ? '🚚 em rota desde ' + fmtHora(r.iniciado_em) : '⏸ não iniciado';
        var np = PARADAS.filter(function (p) { return romDaParada(p) === r.nu_rom; }).length;
        return '<div class="rom"><span><b>' + esc(r.rota) + '</b> · rom. ' + r.nu_rom + ' · ' + np + ' paradas' +
               (r.km_estimado ? ' · ~' + Math.round(r.km_estimado) + ' km' : '') +
               ' · <a href="#" onclick="imprimirRom(' + r.nu_rom + ');return false" style="color:var(--red)">🖨️ imprimir</a></span><span>' + st + '</span></div>';
      }).join('') + '</div>';
  }).join('');
}

function renderOcorrencias() {
  var oc = PARADAS.filter(function (p) { return p.status === 'ocorrencia'; });
  document.getElementById('ocorrencias').innerHTML = oc.length ? oc.map(function (p) {
    return '<div class="mot"><div class="top"><b style="font-size:13px">' + esc(p.fantasia) + '</b><span class="s">' + fmtHora(p.baixa_em) + '</span></div>' +
      '<div class="s"><b style="color:var(--amb)">' + esc(p.ocorrencia_tipo || '') + '</b>' + (p.obs ? ' — ' + esc(p.obs) : '') + '</div>' +
      '<div class="s">' + esc(NOME_MOT[romDe(p).cd_motor] || '') + ' · ' + esc(romDe(p).rota || '') + ' · NF ' + (p.notas || []).map(function (n) { return n.nf || n.nu_nf; }).join(', ') + '</div></div>';
  }).join('') : '<div class="vazio" style="padding:14px">Nenhuma ocorrência.</div>';
}

function renderTabela() {
  var cont = { todas: PARADAS.length, pendente: 0, entregue: 0, ocorrencia: 0 };
  PARADAS.forEach(function (p) { cont[p.status] = (cont[p.status] || 0) + 1; });
  document.getElementById('filtros').innerHTML = [['todas', 'Todas'], ['pendente', 'Pendentes'], ['entregue', 'Entregues'], ['ocorrencia', 'Ocorrências']].map(function (f) {
    return '<button class="' + (FILTRO === f[0] ? 'on' : '') + '" onclick="FILTRO=\'' + f[0] + '\';renderTabela()">' + f[1] + ' (' + (cont[f[0]] || 0) + ')</button>';
  }).join('');
  var lista = PARADAS.filter(function (p) { return FILTRO === 'todas' || p.status === FILTRO; }).slice().sort(function (a, b) {
    var ra = romDe(a), rb = romDe(b);
    return String(ra.cd_motor).localeCompare(String(rb.cd_motor)) || a.nu_rom - b.nu_rom || (a.ordem || 9999) - (b.ordem || 9999);
  });
  document.getElementById('tbody').innerHTML = lista.length ? lista.map(function (p) {
    var r = romDe(p);
    var st = { pendente: 'Pendente', entregue: 'Entregue', ocorrencia: 'Ocorrência' }[p.status] || p.status;
    var det = p.status === 'entregue' ? esc(p.recebedor || '—') + (p.recebedor_doc ? '<br><span style="color:var(--tx2)">doc. ' + esc(p.recebedor_doc) + '</span>' : '') : p.status === 'ocorrencia' ? '<b>' + esc(p.ocorrencia_tipo || '') + '</b>' : (p.eta ? 'previsão ' + fmtHora(p.eta) : '');
    if (p.obs) det += '<br><span style="color:var(--tx2)">' + esc(p.obs) + '</span>';
    return '<tr class="' + (p.status === 'ocorrencia' ? 'oc' : '') + '"><td>' + (p.ordem || '—') + '</td>' +
      '<td><b>' + (p.refrigerado ? '❄️ ' : '') + (p.tipo === 'coleta' ? '↩ ' : '') + esc(p.fantasia) + '</b>' + (p.avulsa ? ' <span style="color:var(--tx3)">(avulsa)</span>' : '') +
      (p.rom_app ? ' <span style="color:var(--amb)">(transferida de ' + p.nu_rom + ')</span>' : '') + '<br><span style="color:var(--tx3)">' + (p.cd_clien ? 'cód. ' + p.cd_clien : 'parada criada no app') + (temCoord(p) ? '' : ' · sem localização') + '</span></td>' +
      '<td>' + esc(p.bairro || '') + '<br><span style="color:var(--tx2)">' + esc(p.municipio || '') + '</span></td>' +
      '<td>' + esc(NOME_MOT[r.cd_motor] || r.cd_motor || '') + '</td><td>' + esc(r.rota || '') + '</td>' +
      '<td>' + (p.notas || []).map(function (n) { return n.nf || n.nu_nf; }).join('<br>') + '</td>' +
      '<td><span class="st ' + p.status + '">' + st + '</span></td>' +
      '<td>' + (p.baixa_em ? fmtHora(p.baixa_em) : '') + '</td><td>' + det + '</td>' +
      '<td>' + (p.foto_url ? '<img class="thumb" loading="lazy" src="' + esc(p.foto_url) + '" onclick="verFoto(this.src)">' : '') + '</td>' +
      '<td>' + (p.status === 'pendente' ? '<select onchange="moverParada(\'' + p.id + '\',this.value)" style="font-family:inherit;font-size:12px;border:1px solid var(--bd);border-radius:6px;padding:4px"><option value="">—</option>' +
        ROMS.filter(function (x) { return x.nu_rom !== r.nu_rom && x.status_app !== 'finalizado'; }).map(function (x) {
          return '<option value="' + x.nu_rom + '">' + esc(x.rota) + ' · ' + esc(NOME_MOT[x.cd_motor] || x.cd_motor || '') + ' · ' + x.nu_rom + '</option>';
        }).join('') + '</select>' : '') + '</td></tr>';
  }).join('') : '<tr><td colspan="11" class="vazio">Nada para mostrar.</td></tr>';
}

function renderMapa() {
  if (typeof L === 'undefined') return;
  if (!MAPA) {
    MAPA = L.map('mapa');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(MAPA);
    CAMADA = L.layerGroup().addTo(MAPA);
  }
  CAMADA.clearLayers();
  var bounds = [], corMot = {};
  Object.keys(ENT.MOTORISTAS).forEach(function (u, i) { corMot[ENT.MOTORISTAS[u].cd] = CORES_MOT[i % CORES_MOT.length]; });
  var linhas = {};
  PARADAS.slice().sort(function (a, b) { return (a.ordem || 9999) - (b.ordem || 9999); }).forEach(function (p) {
    if (!temCoord(p)) return;
    var r = romDe(p), cor = p.status === 'entregue' ? '#16a34a' : p.status === 'ocorrencia' ? '#d97706' : (corMot[r.cd_motor] || '#CC0000');
    var html = p.status === 'entregue' ? '✔' : p.status === 'ocorrencia' ? '!' : (p.ordem || '•');
    CAMADA.addLayer(L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: '<div class="pin" style="background:' + cor + '">' + html + '</div>', iconSize: [24, 24] }) })
      .bindPopup('<b>' + esc(p.fantasia) + '</b><br>' + esc(enderecoTexto(p)) + '<br>' + esc(NOME_MOT[r.cd_motor] || '') + ' · ' + esc(r.rota || '') +
                 (p.baixa_em ? '<br>Baixa ' + fmtHora(p.baixa_em) : p.eta ? '<br>Previsão ' + fmtHora(p.eta) : '') +
                 (p.foto_url ? '<br><a href="' + esc(p.foto_url) + '" target="_blank">Ver canhoto</a>' : '')));
    bounds.push([p.lat, p.lng]);
    (linhas[romDaParada(p)] = linhas[romDaParada(p)] || { cd: r.cd_motor, pts: [] }).pts.push([p.lat, p.lng]);
  });
  Object.keys(linhas).forEach(function (nu) {
    var l = linhas[nu];
    if (l.pts.length > 1) CAMADA.addLayer(L.polyline(l.pts, { color: corMot[l.cd] || '#CC0000', weight: 2, opacity: .5, dashArray: '5 6' }));
  });
  if (PRIMEIRA || !bounds.length) {
    if (bounds.length) MAPA.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 }); else MAPA.setView([-23.55, -46.6], 10);
    PRIMEIRA = !bounds.length;
  }
}
function moverParada(id, alvo) {
  alvo = parseInt(alvo, 10); if (!alvo) return;
  var p = PARADAS.find(function (x) { return x.id === id; }); if (!p) return;
  if (!confirm('Mover "' + p.fantasia + '" para o romaneio ' + alvo + '?')) { renderTabela(); return; }
  sbPatch('entregas_paradas', 'id=eq.' + encodeURIComponent(id), { rom_app: alvo === p.nu_rom ? null : alvo, ordem: null, eta: null })
    .then(carregar).catch(function (e) { alert('Erro: ' + e.message); });
}
function imprimirRom(nu) {
  var r = ROMS.find(function (x) { return x.nu_rom === nu; }); if (!r) return;
  var ps = PARADAS.filter(function (p) { return romDaParada(p) === nu; }).sort(function (a, b) { return (a.ordem || 9999) - (b.ordem || 9999); });
  imprimirRota(r, ps, NOME_MOT[r.cd_motor]);
}
// ── Consulta de canhoto por número de NF (qualquer data) ─────────────────────
function buscarNF() {
  var n = parseInt(String(document.getElementById('busca-nf').value).replace(/\D/g, ''), 10);
  if (!n) return;
  var corpo = document.getElementById('nf-corpo');
  corpo.innerHTML = '<div class="vazio">Procurando NF ' + n + '…</div>';
  document.getElementById('nf-bg').style.display = 'flex';
  var q = function (campo) { var o = {}; o[campo] = n; return sbGet('entregas_paradas?notas=cs.' + encodeURIComponent(JSON.stringify([o])) + '&order=baixa_em.desc.nullslast'); };
  Promise.all([q('nf'), q('nu_nf')]).then(function (rs) {
    var vistos = {}, ps = rs[0].concat(rs[1]).filter(function (p) { if (vistos[p.id]) return false; vistos[p.id] = 1; return true; });
    if (!ps.length) { corpo.innerHTML = '<div class="vazio"><b>Nenhuma entrega encontrada para a NF ' + n + '</b><br>Confira o número ou se a nota entrou em algum romaneio.</div>' + botaoFechar(); return; }
    var roms = ps.map(romDaParada).filter(function (v, i, a) { return a.indexOf(v) === i; });
    return sbGet('entregas_romaneios?nu_rom=in.(' + roms.join(',') + ')').then(function (rr) {
      var mapa = {}; rr.forEach(function (r) { mapa[r.nu_rom] = r; });
      corpo.innerHTML = ps.map(function (p) { return fichaCanhoto(p, mapa[romDaParada(p)] || {}, n); }).join('<hr style="border:none;border-top:1px solid var(--bd);margin:16px 0">') + botaoFechar();
    });
  }).catch(function (e) { corpo.innerHTML = '<div class="vazio">Erro: ' + esc(e.message) + '</div>' + botaoFechar(); });
}
function botaoFechar() { return '<button onclick="document.getElementById(\'nf-bg\').style.display=\'none\'" style="margin-top:14px;width:100%;font-family:inherit;font-weight:700;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:10px;cursor:pointer">Fechar</button>'; }
function fichaCanhoto(p, r, nBusca) {
  var st = { pendente: 'Pendente (ainda não entregue)', entregue: 'Entregue', ocorrencia: 'Ocorrência', removida: 'Removida da rota' }[p.status] || p.status;
  var nfs = (p.notas || []).map(function (x) { return x.nf || x.nu_nf; }).join(', ');
  var linha = function (k, v) { return v ? '<tr><td style="color:var(--tx2);width:150px;padding:4px 0">' + k + '</td><td style="padding:4px 0"><b>' + v + '</b></td></tr>' : ''; };
  return '<h2 style="font-size:17px;margin-bottom:2px">NF ' + esc(nfs) + ' — ' + esc(p.fantasia) + '</h2>' +
    '<div style="color:var(--tx2);font-size:13px;margin-bottom:10px">' + esc(enderecoTexto(p)) + '</div>' +
    '<span class="st ' + esc(p.status) + '">' + esc(st) + '</span>' +
    '<table style="margin:10px 0;font-size:13px">' +
      linha('Romaneio', (r.rota ? esc(r.rota) + ' · ' : '') + romDaParada(p)) +
      linha('Motorista', esc(NOME_MOT[r.cd_motor] || r.cd_motor || '')) +
      linha('Data/hora da baixa', p.baixa_em ? new Date(p.baixa_em).toLocaleString('pt-BR') : '') +
      linha('Recebido por', esc(p.recebedor || '')) +
      linha('Documento', esc(p.recebedor_doc || '')) +
      linha('Ocorrência', esc(p.ocorrencia_tipo || '')) +
      linha('Observação', esc(p.obs || '')) +
      linha('Local da baixa', p.baixa_lat ? '<a target="_blank" href="https://www.google.com/maps?q=' + p.baixa_lat + ',' + p.baixa_lng + '">ver no mapa</a>' : '') +
    '</table>' +
    (p.foto_url ? '<a href="' + esc(p.foto_url) + '" target="_blank"><img src="' + esc(p.foto_url) + '" style="width:100%;border-radius:10px;border:1px solid var(--bd)"></a>' +
                  '<div style="font-size:12px;color:var(--tx2);margin-top:4px">Toque na foto para abrir em tamanho real e baixar.</div>'
                : '<div class="vazio" style="padding:12px">Sem foto do canhoto.</div>');
}
function verFoto(src) { document.getElementById('foto-big').src = src; document.getElementById('foto-bg').style.display = 'flex'; }
</script>
